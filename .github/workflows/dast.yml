name: DAST penetration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

env:
  DAST_ENABLED: ${{ vars.DAST_ENABLED || 'false' }}
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || '' }}

jobs:
  zap-full-scan:
    name: OWASP ZAP full active scan
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Refuse unauthorised/non-HTTPS remote target
        shell: bash
        run: |
          set -euo pipefail
          case "$DAST_TARGET_URL" in https://*) ;; *) echo "::error::DAST_TARGET_URL must be an authorised HTTPS endpoint."; exit 1;; esac
      - name: Check out trusted evidence helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run authorised ZAP full scan
        id: zap
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}

      - name: Package exact-run DAST evidence
        if: always()
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dast-r2"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
            \( -name 'report_json.json' -o -name 'report_html.html' -o -name 'report_md.md' \) \
            -exec cp {} "$RUNNER_TEMP/dast-r2/" \;
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg outcome "$ZAP_OUTCOME" \
            '{repository:$repository,default_branch_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,scanner:"OWASP ZAP",dast_status:$outcome}' \
            > "$RUNNER_TEMP/dast-r2/summary.json"
      - name: Persist and verify DAST evidence in R2
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EVIDENCE_STATUS: ${{ steps.zap.outcome }}
        run: python3 .github/scripts/persist_ci_report_r2.py dast "$GITHUB_SHA" "$RUNNER_TEMP/dast-r2"
