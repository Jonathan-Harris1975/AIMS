          # The watcher derives its target and expected inventory from config/production.defaults.env.
name: Comms Hub continuous worker watch
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_run: # zizmor: ignore[dangerous-triggers] same-repository main-branch deployment result is authenticated in the job gate below
    workflows: ["Koyeb production deployment watch"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: comms-hub-continuous-worker-watch
  cancel-in-progress: false
jobs:
  watch:
    if: >-
      ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
           github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Koyeb CLI
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2             --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2             --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Collect sanitised worker health inside Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          test -n "${KOYEB_TOKEN:-}" || { echo "::error::KOYEB_TOKEN is required for the worker watch." >&2; exit 2; }
          test -n "${KOYEB_SERVICE:-}" || { echo "::error::KOYEB_SERVICE is required for the worker watch." >&2; exit 2; }
          printf -v exec_command 'koyeb services exec %q node -- scripts/collectCommsWorkerHealth.js' "$KOYEB_SERVICE"
          output="$(script -q -e -c "$exec_command" /dev/null < /dev/null)"
          encoded="$(printf '%s\n' "$output" | sed -n 's/.*WORKER_HEALTH_B64=//p' | tail -n 1 | tr -d '\r')"
          test -n "$encoded" || { echo "::error::Koyeb worker health probe returned no sanitised payload." >&2; exit 1; }
          printf '%s' "$encoded" | base64 --decode > worker-health.json
          python3 -c 'import json; json.load(open("worker-health.json", encoding="utf-8"))'
      - name: Check workers and retain independent GitHub incident evidence
        env:
          GH_TOKEN: ${{ github.token }}
          COMMS_WORKER_HEALTH_FILE: worker-health.json
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          WATCH_SCHEDULED_AT: '' # GitHub does not supply the nominal occurrence timestamp.
        run: |
          WATCH_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export WATCH_STARTED_AT
          python3 scripts/comms_worker_watch.py
      - name: Persist incident state and detection timestamps
        if: ${{ always() && hashFiles('worker-watch-state.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comms-worker-watch-state
          path: worker-watch-state.json
          if-no-files-found: error
          retention-days: 90
