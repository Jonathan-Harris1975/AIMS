name: Koyeb production deployment watch

on:
  # zizmor: ignore[dangerous-triggers] exact-SHA post-CI gate; only successful same-repository main push runs are accepted below
  workflow_run:
    workflows: ["AIMS CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-deployment-watch-AIMS
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Require Koyeb production release-gate configuration
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          test -n "${KOYEB_TOKEN:-}" || { echo "KOYEB_TOKEN is required for the production release gate." >&2; exit 2; }
          test -n "${KOYEB_SERVICE:-}" || { echo "KOYEB_SERVICE is required for the production release gate." >&2; exit 2; }
      - name: Install verified Koyeb CLI
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Koyeb minimum instances before deployment watch
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: npm run koyeb:min-instances:check
      - name: Watch production deployment
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          SERVICE_DISPLAY_NAME: AIMS
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_AFTER: ${{ github.event.workflow_run.created_at || '' }}
        run: python scripts/watch_koyeb_deployment.py
      - name: Verify Koyeb minimum instances after deployment
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: npm run koyeb:min-instances:check
      - name: Deploy Comms Hub D1 data-plane Worker from Koyeb runtime credentials
        timeout-minutes: 10
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          # Run from the exact production SHA already verified above. Koyeb
          # resolves D1_API_KEY and the Cloudflare account ID inside the service.
          # Node uploads the canonical module directly: npm/npx are deliberately
          # absent from this hardened runtime. No token is copied into Actions.
          printf -v exec_command 'koyeb services exec %q node -- scripts/deployCommsHubDataPlaneWorker.js' "$KOYEB_SERVICE"
          script -q -e -c "$exec_command" /dev/null < /dev/null
      - name: Synchronise AIMS-owned AIMS-UI Worker secrets
        timeout-minutes: 5
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          # Execute inside the verified Koyeb runtime so the canonical shared
          # secrets and Cloudflare token never transit through GitHub Actions.
          # %q requires bash; this workflow explicitly runs on ubuntu-latest with bash.
          printf -v exec_command 'koyeb services exec %q node -- scripts/syncAimsUiWorkerSecrets.js' "$KOYEB_SERVICE"
          script -q -e -c "$exec_command" /dev/null < /dev/null
      - name: Verify Worker health after runtime deployment
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          const url = 'https://aims-comms-hub-data-plane.solitary-salad-3d16.workers.dev/health';
          for (let attempt = 0; attempt < 5; attempt += 1) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000), redirect: 'error' });
              const health = await response.json();
              if (response.ok && health.ok === true && health.service === 'comms-hub-data-plane') process.exit(0);
            } catch { /* A bounded read-only retry permits propagation after upload. */ }
            if (attempt < 4) await delay(5000);
          }
          console.error('Deployed Comms Hub data-plane Worker health verification failed.');
          process.exit(1);
          JS
      - name: Inspect content delivery in the deployed service
        continue-on-error: true
        timeout-minutes: 5
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          # The CLI uses an interactive exec transport. This is a read-only
          # snapshot; no credentials or subscriber details are printed.
          printf -v exec_command 'koyeb services exec %q node -- scripts/contentDeliveryDiagnostics.js' "$KOYEB_SERVICE"
          script -q -e -c "$exec_command" /dev/null < /dev/null
      - name: Record exact-SHA production deployment attestation
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"AIMS","status":"production-deployment-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$GITHUB_RUN_ID" > deployment-attestation.json
      - name: Retain production deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aims-deployment-attestation-${{ github.event.workflow_run.head_sha || github.sha }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 90
  ecosystem_smoke_dispatch:
    name: Dispatch central ecosystem smoke
    needs: [watch]
    if: ${{ needs.watch.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch with bounded transient retry
        env:
          ECOSYSTEM_SMOKE_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_SMOKE_DISPATCH_TOKEN }}
          ECOSYSTEM_SMOKE_REPOSITORY: ${{ vars.ECOSYSTEM_SMOKE_REPOSITORY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${ECOSYSTEM_SMOKE_DISPATCH_TOKEN:-}" || { echo "::error::ECOSYSTEM_SMOKE_DISPATCH_TOKEN is required." >&2; exit 1; }
          target="${ECOSYSTEM_SMOKE_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/MAST}"
          payload="$(jq -cn --arg ref main --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '{ref:$ref,inputs:{source_repository:$repo,source_sha:$sha}}')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${ECOSYSTEM_SMOKE_DISPATCH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${target}/actions/workflows/ecosystem-smoke.yml/dispatches" || true)"
            if [ "$code" = "204" ]; then
              echo "Central ecosystem smoke dispatch accepted on attempt $attempt."
              exit 0
            fi
            if [ "$code" = "000" ] || [ "$code" = "429" ] || [[ "$code" =~ ^5[0-9][0-9]$ ]]; then
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 5))
                echo "::warning::Transient GitHub dispatch response HTTP $code; retrying in ${delay}s."
                sleep "$delay"
                continue
              fi
            else
              echo "::error::Central ecosystem smoke dispatch rejected with HTTP $code." >&2
              cat "$response" >&2 || true
              exit 1
            fi
          done
          echo "::error::Central ecosystem smoke dispatch failed after bounded retries." >&2
          cat "$response" >&2 || true
          exit 1

  open_renovate_revert:
    name: Open validated Renovate revert PR
    needs: [watch]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.watch.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Revert only the failed Renovate merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$FAILED_SHA/pulls" \
            --jq '[.[] | select(.user.login == "renovate[bot]" and .merged_at != null)] | first | .number // empty')"
          if [ -z "$pr_number" ]; then
            echo "Failed deployment SHA $FAILED_SHA is not a merged Renovate PR; no automatic revert is created."
            exit 0
          fi

          base_ref="$(gh pr view "$pr_number" --json baseRefName --jq '.baseRefName')"
          title="$(gh pr view "$pr_number" --json title --jq '.title')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$base_ref" --prune
          git checkout -B "$base_ref" "origin/$base_ref"
          git cat-file -e "$FAILED_SHA^{commit}" 2>/dev/null || git fetch origin "$FAILED_SHA"

          branch="automation/revert-renovate-${pr_number}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          parent_count="$(git rev-list --parents -n 1 "$FAILED_SHA" | awk '{print NF-1}')"
          if [ "$parent_count" -gt 1 ]; then
            git revert -m 1 --no-edit "$FAILED_SHA"
          else
            git revert --no-edit "$FAILED_SHA"
          fi
          git push --set-upstream origin "$branch"

          printf '%s\n\n%s\n\n%s\n' \
            "This PR automatically reverts Renovate PR #${pr_number} because the exact deployed SHA \`${FAILED_SHA}\` failed the production validation workflow." \
            "Original Renovate PR: #${pr_number} — ${title}" \
            "The revert is deliberately opened as a PR so the repository's normal CI and required checks validate the recovery before it can merge." \
            > /tmp/revert-body.md
          gh pr create \
            --base "$base_ref" \
            --head "$branch" \
            --title "revert: Renovate PR #${pr_number} after failed deployment validation" \
            --body-file /tmp/revert-body.md
