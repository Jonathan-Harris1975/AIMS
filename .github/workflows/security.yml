name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aims-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Intentionally inside the already-required security job so this lifecycle
      # contract is a hard admission gate, not a merely visible sibling check.
      - name: Verify automation ownership and Council-freeze lifecycle
        run: python3 .github/scripts/test_autonomy_lifecycle.py
      - name: Repository secret policy scan
        run: python3 scripts/secret_scan.py
      - name: Install pinned Gitleaks and actionlint
        env:
          GOBIN: ${{ runner.temp }}/ci-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$GOBIN" gitleaks
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C "$GOBIN" actionlint
          chmod +x "$GOBIN/gitleaks" "$GOBIN/actionlint"
      - name: Verify Gitleaks exact-fingerprint ignore contract
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-bin/gitleaks
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          git init -q
          git config user.name 'AIMS CI'
          git config user.email 'ci@example.invalid'

          canary_one="ghp_$(printf 'aims-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_one" > ignored.txt
          git add ignored.txt
          git commit -qm 'synthetic ignored finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
          first_status=$?
          set -e
          test "$first_status" -eq 42 || {
            echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
            exit 1
          }

          fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
          printf '%s\n' "$fingerprint" > .gitleaksignore

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          ignored_status=$?
          set -e
          test "$ignored_status" -eq 0 || {
            echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
            exit 1
          }
      - name: Run Gitleaks on repo history (soft fail)
        id: gitleaks
        continue-on-error: true
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-bin/gitleaks
          RAW_REPORT: ${{ runner.temp }}/gitleaks-raw.json
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            "$GITLEAKS_BIN" detect --source . --log-opts "$base_sha..$head_sha" --redact=100 --no-banner --report-format json --report-path "$RAW_REPORT" --exit-code 42
          else
            "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path "$RAW_REPORT" --exit-code 42
          fi
      - name: Publish safe Gitleaks finding locations
        id: gitleaks_report
        if: always()
        env:
          RAW_REPORT: ${{ runner.temp }}/gitleaks-raw.json
          SAFE_REPORT_DIR: ${{ runner.temp }}/gitleaks-safe
        run: |
          set -euo pipefail
          python3 test/gitleaks_report_test.py
          python3 scripts/gitleaks_report.py "$RAW_REPORT" "$SAFE_REPORT_DIR" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload safe Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-safe-findings
          path: ${{ runner.temp }}/gitleaks-safe
          if-no-files-found: ignore
      - name: Enforce Gitleaks result
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: test "$GITLEAKS_OUTCOME" = success
      - name: Run actionlint
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/ci-bin/actionlint
        run: |
          set -euo pipefail
          "$ACTIONLINT_BIN" -color
      - name: Run Trivy filesystem scan (fs)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          sarif_file: 'trivy-results.sarif'
