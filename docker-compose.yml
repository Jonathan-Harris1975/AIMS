services:
  aims:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: aims:local
    container_name: aims
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:${PORT:-3000}/livez >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
