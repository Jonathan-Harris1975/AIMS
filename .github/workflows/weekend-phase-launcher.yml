name: Weekend CI phase launcher
'on':
  schedule:
  - cron: 0 20 * * 5
  - cron: 0 19 * * 5
  - cron: 0 22 * * 6
  - cron: 0 21 * * 6
  - cron: 30 18 * * 0
  - cron: 30 17 * * 0
  workflow_dispatch:
    inputs:
      phase:
        description: Phase to dispatch
        required: true
        default: ci
        type: choice
        options:
        - ci
        - dast
        - council
permissions:
  actions: write
  contents: read
concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Resolve Europe/London phase slot
      id: slot
      env:
        EVENT_NAME: ${{ github.event_name }}
        MANUAL_PHASE: ${{ inputs.phase || '' }}
        SCHEDULE: ${{ github.event.schedule || '' }}
        CI_START: Fri 20:00
        DAST_START: Sat 22:00
        COUNCIL_START: Sun 18:30
        CI_WORKFLOW: ci.yml
      shell: bash
      run: python3 .github/scripts/weekend_slot.py
    - name: Dispatch phase workflow
      if: steps.slot.outputs.run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ steps.slot.outputs.workflow }}
        PHASE: ${{ steps.slot.outputs.phase }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        if [ "$PHASE" = ci ]; then
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        fi
    - name: Record allocated windows
      if: always()
      run: "echo \"CI: Fri 20:00\u2013Fri 22:30\"\necho \"DAST: Sat 22:00\u2013Sun 00:00\"\necho \"Council: Sun 18:30\u2013Sun 21:00\"\necho \"Weekend operating envelope: Friday 20:00 to Monday 04:00 Europe/London\"\n"
