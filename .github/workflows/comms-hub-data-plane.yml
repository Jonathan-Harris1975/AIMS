name: Comms Hub D1 data-plane Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/comms-hub-data-plane/**'
      - '.github/workflows/comms-hub-data-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comms-hub-data-plane-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.127.1'
  WORKER_URL: 'https://aims-comms-hub-data-plane.solitary-salad-3d16.workers.dev'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/comms-hub-data-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate Worker syntax
        run: node --check worker.js
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run

  deploy:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/comms-hub-data-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Deploy Worker at exact Wrangler version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is required' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is required' >&2; exit 1; }
          npx --yes wrangler@${WRANGLER_VERSION} deploy
      - name: Verify Worker health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 "${WORKER_URL}/health" | grep -Fq '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Comms Hub data-plane Worker health check failed' >&2
          exit 1
