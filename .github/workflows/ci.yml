name: AIMS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Reject committed literal secrets
        run: python3 scripts/secret_scan.py
      - name: Reject unapproved repository duplication and hygiene regressions
        run: python3 scripts/check_repository_hygiene.py
      - name: Install pinned npm toolchain
        run: npm install --global npm@12.2.1 --no-audit --no-fund
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(npm --version)" = "12.2.1"
      - run: npm ci
      - name: Reject legacy envBootstrap imports
        run: |
          if grep -RInE 'scripts/envBootstrap\.js|import[[:space:]]+[^;]*\bENV\b[^;]*from' deployment-check.js scripts services routes server.js --exclude='envBootstrap.js' --exclude='*.md'; then
            exit 1
          fi
      - name: Run canonical release verification
        run: npm run verify:release
      - name: Verify trusted automation evidence admission safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_trusted_automation_evidence.py'
      - name: Verify PR repair routing and blocker recovery
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_pr_blocker_recovery.py'
      - name: Verify worker-watch failure and recovery handling
        run: python3 -B -m unittest discover -s scripts -p 'test_comms_worker_watch.py'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t aims:ci .
      - name: Verify pinned runtime, minimal attack surface, non-root user and writable runtime state
        run: |
          docker run --rm aims:ci node -e '
            const pkg = require("./package.json");
            const actualNode = process.versions.node;
            if (actualNode !== pkg.engines.node) {
              console.error(`Runtime mismatch: node=${actualNode}; expected node=${pkg.engines.node}`);
              process.exit(1);
            }
          '
          docker run --rm aims:ci sh -eu -c '! command -v npm >/dev/null 2>&1; ! command -v npx >/dev/null 2>&1'
          docker run --rm aims:ci node scripts/deployCommsHubDataPlaneWorker.js --check
          test "$(docker image inspect aims:ci --format '{{.Config.User}}')" = "node"
          docker run --rm aims:ci sh -eu -c 'test "$(id -u)" -ne 0; test -w /app/local-data'
      - name: Smoke AIMS production image and validate fail-closed readiness
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e ALLOW_EPHEMERAL_STATE=true \
            -e STATE_BACKEND=local \
            -e DEPLOY_SMOKE_EXPECT_READY=false \
            aims:ci node scripts/deploySmoke.js
      - name: Scan AIMS production image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aims:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret
  headroom:
    name: Build and scan Headroom companion image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Headroom companion image
        run: docker build -f headroom/Dockerfile -t aims-headroom:ci .
      - name: Verify Headroom hardened runtime
        run: |
          test "$(docker image inspect aims-headroom:ci --format '{{.Config.User}}')" = "nonroot"
          docker run --rm --entrypoint /opt/headroom/bin/python aims-headroom:ci -c '
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          assert version("headroom-ai") == "0.38.0", version("headroom-ai")
          assert version("msgpack") == "1.2.3", version("msgpack")
          assert version("setuptools") == "83.0.0", version("setuptools")
          assert find_spec("pip") is None, "pip must not be present in the production image"
          assert not any(Path("/opt/headroom/bin").glob("pip*")), "pip entrypoint present"
          site = Path("/opt/headroom/lib")
          stale = [p for p in site.rglob("*") if p.name.startswith(("msgpack-1.1.2.dist-info", "setuptools-70.3.0.dist-info"))]
          assert not stale, f"stale vulnerable package metadata present: {stale}"
          from headroom._core import DiffCompressor, SmartCrusher
          print(f"Headroom runtime verified: {DiffCompressor.__name__}, {SmartCrusher.__name__}")
          '
          health_container=aims-headroom-health
          trap 'docker rm -f "$health_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$health_container" --health-interval=30s --health-timeout=5s --health-start-period=20s --health-retries=3 aims-headroom:ci
          health_checks_remaining=30
          while [ "$health_checks_remaining" -gt 0 ]; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$health_container")"
            case "$health" in
              healthy) exit 0 ;;
              unhealthy) docker logs "$health_container"; exit 1 ;;
            esac
            sleep 1
            health_checks_remaining=$((health_checks_remaining - 1))
          done
          docker logs "$health_container"
          exit 1
      - name: Scan Headroom companion image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aims-headroom:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, docker, headroom]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service AIMS
          --event-type ci_failed
          --title "AIMS GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, docker, headroom]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
          RESULT_HEADROOM: ${{ needs.headroom.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          test "$RESULT_DOCKER" = "success"
          test "$RESULT_HEADROOM" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

  ci_gate:
    name: ci-gate
    needs: [release_gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require exact-SHA release gate
        env:
          RELEASE_GATE_RESULT: ${{ needs.release_gate.result }}
        run: test "$RELEASE_GATE_RESULT" = success
