name: Podcast site sync recovery

# Normal production ownership lives in the Friday AIMS podcast pipeline, which
# triggers WEBSITE_REBUILD_HOOK only after RSS publication has completed. Keep
# this workflow as an operator recovery control; do not create a second clock.
on:
  workflow_dispatch:

permissions: {}

jobs:
  trigger-website-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild hook
        env:
          WEBSITE_REBUILD_HOOK: ${{ secrets.WEBSITE_REBUILD_HOOK }}
        run: |
          if [ -z "${WEBSITE_REBUILD_HOOK:-}" ]; then
            echo "WEBSITE_REBUILD_HOOK secret is not configured"
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/rebuild-response.txt -w '%{http_code}' -X POST "$WEBSITE_REBUILD_HOOK")
          cat /tmp/rebuild-response.txt || true
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Website rebuild hook failed with status $STATUS"
            exit 1
          fi
