# Koyeb/native buildpack fallback. Dockerfile remains the preferred builder.
[variables]
NODE_ENV = "production"
NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_FETCH_RETRIES = "2"
NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "10000"
NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "30000"
NPM_CONFIG_FETCH_TIMEOUT = "60000"
RSS_INIT_ON_BOOT = "false"

[phases.setup]
nixPkgs = ["nodejs_22", "ffmpeg", "chromium"]

[phases.install]
cmds = [
  "npm config set registry https://registry.npmjs.org/",
  "env -i PATH=$PATH HOME=$HOME NODE_ENV=production NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false npm ci --omit=dev --ignore-scripts --no-audit --no-fund"
]

[phases.build]
cmds = ["env -i PATH=$PATH HOME=$HOME NODE_ENV=production NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false npm run build"]

[start]
cmd = "npm start"
