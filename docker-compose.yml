services:
  headroom:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    image: aims-headroom:0.37.0
    container_name: aims-headroom
    restart: unless-stopped
    environment:
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_SAVINGS_PROFILE: balanced
      HEADROOM_MODE: token
      HEADROOM_TARGET_RATIO: ${HEADROOM_TARGET_RATIO:-0.30}
      HEADROOM_COMPRESS_USER_MESSAGES: "true"
      HEADROOM_COMPRESS_SYSTEM_MESSAGES: "false"
      HEADROOM_PROTECT_RECENT: "0"
      HEADROOM_MIN_TOKENS: "250"
      HEADROOM_KOMPRESS_BACKEND: auto
      HEADROOM_TELEMETRY: "on"
      HEADROOM_STATELESS: "true"
    ports:
      - "127.0.0.1:${HEADROOM_PORT:-8787}:8787"

  aims:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: aims:local
    container_name: aims
    restart: unless-stopped
    depends_on:
      headroom:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HEADROOM_ENABLED: "true"
      HEADROOM_BASE_URL: http://headroom:8787
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      HEADROOM_TIMEOUT_MS: ${HEADROOM_TIMEOUT_MS:-5000}
      HEADROOM_MIN_INPUT_CHARS: ${HEADROOM_MIN_INPUT_CHARS:-1000}
      HEADROOM_TARGET_RATIO: ${HEADROOM_TARGET_RATIO:-0.30}
      HEADROOM_PROTECT_RECENT: ${HEADROOM_PROTECT_RECENT:-0}
      HEADROOM_COMPRESS_USER_MESSAGES: ${HEADROOM_COMPRESS_USER_MESSAGES:-true}
      HEADROOM_LOG_SAVINGS: ${HEADROOM_LOG_SAVINGS:-true}
      HEADROOM_ROUTES: intro,main,outro,scriptIntro,scriptMain,scriptMainSynthesis,scriptOutro,compose,editorialPass,editAndFormat,metadata,podcastHelper,seoKeywords,artworkPrompt,rssRewrite,rssShortTitle,blogWeekly,blogSocial,onBrandAudit,auditForensic,zernioDaily,zernioMiniSeriesResearch,zernioMiniSeriesTheme,zernioMiniSeriesPost,zernioQuiz,zernioEbook,zernioPodcastPromo,blotatoNewsShort,newsletterCompose,newsletterSubject,newsletterFactCheck,newsletterVoiceReview,newsletterAudienceReview,newsletterCouncilChair,newsletterHeroPrompt,commsHubTriage,commsHubModeration,commsHubSummary,commsHubDraft,commsHubDraftContact,commsHubDraftContribute,commsHubDraftPodcast,commsHubDraftSocial,commsHubFollowUp,commsHubDraftComplex,commsHubOutreachPitch,commsHubOutreachReply,commsHubOutreachArticle,commsHubOutreachArticleReview
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:${PORT:-3000}/livez >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

