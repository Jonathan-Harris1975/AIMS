name: AIMS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Reject committed literal secrets
        run: python3 scripts/secret_scan.py
      - name: Reject unapproved repository duplication and hygiene regressions
        run: python3 scripts/check_repository_hygiene.py
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - name: Reject legacy envBootstrap imports
        run: |
          if grep -RInE 'scripts/envBootstrap\.js|import[[:space:]]+[^;]*\bENV\b[^;]*from' deployment-check.js scripts services routes server.js --exclude='envBootstrap.js' --exclude='*.md'; then
            exit 1
          fi
      - name: Run canonical release verification
        run: npm run verify:release

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t aims:ci .
      - name: Build Headroom companion image
        run: docker build -f headroom/Dockerfile -t aims-headroom:ci .
      - name: Verify Headroom hardened runtime
        run: |
          test "$(docker image inspect aims-headroom:ci --format '{{.Config.User}}')" = "nonroot"
          docker run --rm --entrypoint /opt/headroom/bin/python aims-headroom:ci -c '
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path
          assert version("headroom-ai") == "0.37.0", version("headroom-ai")
          assert version("msgpack") == "1.2.1", version("msgpack")
          assert version("setuptools") == "83.0.0", version("setuptools")
          assert find_spec("pip") is None, "pip must not be present in the production image"
          assert not any(Path("/opt/headroom/bin").glob("pip*")), "pip entrypoint present"
          site = Path("/opt/headroom/lib")
          stale = [p for p in site.rglob("*") if p.name.startswith(("msgpack-1.1.2.dist-info", "setuptools-70.3.0.dist-info"))]
          assert not stale, f"stale vulnerable package metadata present: {stale}"
          from headroom._core import DiffCompressor, SmartCrusher
          print(f"Headroom runtime verified: {DiffCompressor.__name__}, {SmartCrusher.__name__}")
          '
      - name: Verify pinned runtime, minimal attack surface, non-root user and writable runtime state
        run: |
          docker run --rm aims:ci node -e '
            const pkg = require("./package.json");
            const actualNode = process.versions.node;
            if (actualNode !== pkg.engines.node) {
              console.error(`Runtime mismatch: node=${actualNode}; expected node=${pkg.engines.node}`);
              process.exit(1);
            }
          '
          docker run --rm aims:ci sh -eu -c '! command -v npm >/dev/null 2>&1; ! command -v npx >/dev/null 2>&1'
          test "$(docker image inspect aims:ci --format '{{.Config.User}}')" = "node"
          docker run --rm aims:ci sh -eu -c 'test "$(id -u)" -ne 0; test -w /app/local-data'
      - name: Smoke AIMS production image and validate fail-closed readiness
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e ALLOW_EPHEMERAL_STATE=true \
            -e STATE_BACKEND=local \
            -e DEPLOY_SMOKE_EXPECT_READY=false \
            aims:ci node scripts/deploySmoke.js
      - name: Scan AIMS production image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aims:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret
      - name: Scan Headroom companion image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aims-headroom:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, docker]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service AIMS
          --event-type ci_failed
          --title "AIMS GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          test "$RESULT_DOCKER" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90
