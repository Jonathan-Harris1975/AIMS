version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      aws-sdk-family:
        patterns:
          - "@aws-sdk/*"
        update-types:
          - "patch"
          - "minor"
      pino-family:
        patterns:
          - "pino"
          - "pino-http"
          - "pino-pretty"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(docker)"

  # Headroom uses its own literal Dockerfile so Dependabot can track the image tag.
  - package-ecosystem: "docker"
    directory: "/headroom"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(headroom)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(ci)"
