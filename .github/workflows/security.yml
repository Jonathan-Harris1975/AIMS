name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aims-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Repository secret policy scan
        run: python3 scripts/secret_scan.py
      - name: Install pinned Gitleaks and actionlint
        env:
          GOBIN: ${{ runner.temp }}/ci-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Verify Gitleaks exact-fingerprint ignore contract
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-bin/gitleaks
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          git init -q
          git config user.name 'AIMS CI'
          git config user.email 'ci@example.invalid'

          canary_one="ghp_$(printf 'aims-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_one" > ignored.txt
          git add ignored.txt
          git commit -qm 'synthetic ignored finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
          first_status=$?
          set -e
          test "$first_status" -eq 42 || {
            echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
            exit 1
          }

          fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
          printf '%s\n' "$fingerprint" > .gitleaksignore

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          ignored_status=$?
          set -e
          test "$ignored_status" -eq 0 || {
            echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
            exit 1
          }

          canary_two="ghp_$(printf 'aims-gitleaks-ignore-contract-two' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_two" > unlisted.txt
          git add .gitleaksignore unlisted.txt
          git commit -qm 'synthetic unlisted finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          unlisted_status=$?
          set -e
          test "$unlisted_status" -eq 42 || {
            echo "::error::Unlisted synthetic finding did not fail Gitleaks (exit $unlisted_status)."
            exit 1
          }

      - name: Gitleaks history scan
        id: gitleaks
        continue-on-error: true
        run: |
          "${{ runner.temp }}/ci-bin/gitleaks" git . --redact=100 --no-banner \
            --report-format json --report-path "${{ runner.temp }}/gitleaks-raw.json"
      - name: Publish safe Gitleaks finding locations
        if: always()
        env:
          RAW_REPORT: ${{ runner.temp }}/gitleaks-raw.json
          SAFE_REPORT_DIR: ${{ runner.temp }}/gitleaks-safe
        run: |
          python3 test/gitleaks_report_test.py
          python3 scripts/gitleaks_report.py "$RAW_REPORT" "$SAFE_REPORT_DIR" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Gitleaks review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-safe/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Gitleaks result
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          test "$GITLEAKS_OUTCOME" = success
      - name: Validate GitHub Actions workflows
        run: |
          "${{ runner.temp }}/ci-bin/actionlint" -color
      - name: Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  autonomy_lifecycle:
    name: Autonomy ownership and Council-freeze lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Split from the Trivy/Gitleaks/actionlint security gate so a lifecycle-test
      # flake cannot mask or be masked by scanner results, while remaining a blocking
      # gate in this workflow. This check is hermetic (stdlib-only, all GitHub writes
      # mocked) and validates the trusted-automation ownership and Council exact-SHA
      # freeze lifecycle. Do not weaken it with continue-on-error: lifecycle regressions
      # must block admission. Mergify/branch protection still key on the unchanged
      # required check name 'Trivy, Gitleaks and actionlint' for the scanner gate.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify automation ownership and Council-freeze lifecycle
        run: python3 .github/scripts/test_autonomy_lifecycle.py
