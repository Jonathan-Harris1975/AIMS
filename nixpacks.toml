# Koyeb/native buildpack fallback.
# Prefer the Dockerfile builder on Koyeb. This file keeps native-builder deploys
# deterministic if the service is accidentally switched back to Nixpacks.

[variables]
NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_PROGRESS = "false"
NPM_CONFIG_FETCH_RETRIES = "2"
NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "10000"
NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "60000"
NPM_CONFIG_FETCH_TIMEOUT = "60000"

[phases.setup]
nixPkgs = ["nodejs_22", "ffmpeg", "curl", "ca-certificates"]

[phases.install]
cmds = ["npm ci --omit=dev --ignore-scripts --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
