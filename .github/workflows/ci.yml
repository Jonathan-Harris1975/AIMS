name: CI – Env hygiene & build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  env-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (deterministic)
        run: npm ci

      # ------------------------------------------------------------
      # ENV discipline: NO direct process.env in application code
      # ------------------------------------------------------------
      - name: Enforce ENV-only access
        run: |
          echo "🔍 Scanning for illegal process.env usage..."

          if grep -R "process\.env" \
            services routes utils scripts server.js \
            --include="*.js" \
            --exclude=scripts/envBootstrap.js \
            --exclude=deployment-check.js; then

            echo "❌ process.env usage found outside envBootstrap.js"
            exit 1
          else
            echo "✅ ENV-only rule passed"
          fi

      # ------------------------------------------------------------
      # Optional: build validation (no Docker here)
      # ------------------------------------------------------------
      - name: Validate app boot (no secrets)
        run: node deployment-check.js
